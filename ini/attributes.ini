[general]
sites=all # should be a space-separated list of site abbreviations as the polygons are named
year_start=2017
year_end=2017 # for data_type optical, year_end should be the same as year_start
data_type=optical # options: optical, dem
rasterize=False # options: True, False, should be True for data_type dem and False for data_type optical
crs=6933 # All data should be reprojected to this CRS for area and volume calculations
soc=wang # options: wang
gi=data # options: data